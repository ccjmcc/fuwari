name: Build and Deploy to page branch

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      reason:
        description: Trigger reason for the deployment
        required: false
        default: manual dispatch
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20
          cache: pnpm

      - name: Install Dependencies
        run: pnpm install

      - name: Build
        run: pnpm run build

      - name: Deploy to page branch
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: page
          cname: www.ccjmcc.xyz
          commit_message: ${{ github.event.head_commit.message || github.event.inputs.reason || format('Deploy via {0}', github.event_name) }}
